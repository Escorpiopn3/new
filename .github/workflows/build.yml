name: Build MS2109 RTSP server (OpenWrt 22.03.5)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget curl \
            subversion xsltproc

      - name: Download matching OpenWrt SDK
        run: |
          SDK_URL="https://downloads.openwrt.org/releases/22.03.5/targets/ramips/mt7621/openwrt-sdk-22.03.5-ramips-mt7621_gcc-11.2.0_musl.Linux-x86_64.tar.xz"
          wget -O sdk.tar.xz "$SDK_URL"
          echo "1c7060d5b3653f73b062a31bf3220e59e696a2790c38c5e3352afffaf304fbdd  sdk.tar.xz" | sha256sum -c -
          mkdir sdk
          tar -xf sdk.tar.xz -C sdk --strip-components=1

      - name: Fetch OpenWrt 22.03 package feed
        working-directory: sdk
        run: |
          printf '%s\n' 'src-git packages https://github.com/openwrt/packages.git;openwrt-22.03' > feeds.conf
          ./scripts/feeds update packages
          ./scripts/feeds install -p packages alsa-lib v4l2rtspserver
          test -f package/feeds/packages/v4l2rtspserver/Makefile
          test -f package/feeds/packages/alsa-lib/Makefile

      - name: Enable ALSA support
        working-directory: sdk
        run: |
          sed -i 's/DEPENDS:=+libstdcpp/DEPENDS:=+libstdcpp +alsa-lib/' package/feeds/packages/v4l2rtspserver/Makefile
          sed -i 's/-DALSA=OFF/-DALSA=ON/' package/feeds/packages/v4l2rtspserver/Makefile
          grep -nE 'DEPENDS:=|ALSA=' package/feeds/packages/v4l2rtspserver/Makefile

      - name: Configure SDK
        working-directory: sdk
        run: |
          make defconfig
          echo 'CONFIG_PACKAGE_alsa-lib=y' >> .config
          echo 'CONFIG_PACKAGE_v4l2rtspserver=y' >> .config
          make defconfig

      - name: Compile packages
        working-directory: sdk
        run: |
          make package/feeds/packages/alsa-lib/compile V=s
          make package/feeds/packages/v4l2rtspserver/compile V=s

      
      - name: Collect IPK files
        run: |
          mkdir -p output

          find sdk/bin -type f -name 'v4l2rtspserver_*.ipk' -exec cp {} output/ \;
          find sdk/bin -type f -name 'alsa-lib_*.ipk' -exec cp {} output/ \;

          if ! ls output/v4l2rtspserver_*.ipk >/dev/null 2>&1; then
            echo "ERROR: v4l2rtspserver IPK not found"
            exit 1
          fi

          cat > output/BUILD-INFO.txt <<'EOF'
          OpenWrt: 22.03.5
          Target: ramips/mt7621
          Architecture: mipsel_24kc
          ALSA: enabled
          EOF


      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ms2109-openwrt-22.03.5-mt7621
          path: output/*
          if-no-files-found: error
